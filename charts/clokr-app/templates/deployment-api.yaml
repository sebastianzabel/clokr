apiVersion: apps/v1
kind: Deployment
metadata:
  name: clokr-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "clokr-app.labels" . | nindent 4 }}
    app: clokr-api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: clokr-api
  template:
    metadata:
      labels:
        app: clokr-api
        {{- include "clokr-app.labels" . | nindent 8 }}
    spec:
      {{- if .Values.postgres.enabled }}
      initContainers:
      - name: wait-for-db
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          until nc -z clokr-postgres.{{ .Release.Namespace }}.svc.cluster.local 5432; do
            echo "Waiting for postgres..."; sleep 2;
          done
      {{- end }}
      containers:
      - name: clokr-api
        image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}/clokr-api:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.api.port }}
          name: http
        envFrom:
        - secretRef:
            name: clokr-secrets
        env:
        - name: NODE_ENV
          value: "production"
        - name: API_PORT
          value: "{{ .Values.api.port }}"
        - name: API_HOST
          value: "0.0.0.0"
        resources:
          {{- toYaml .Values.api.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /health           # Dockerfile HEALTHCHECK uses /health (no /api/v1/ prefix)
            port: {{ .Values.api.port }}
          initialDelaySeconds: 30
          periodSeconds: 30
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /health
            port: {{ .Values.api.port }}
          initialDelaySeconds: 10
          periodSeconds: 10
