apiVersion: v1
kind: Secret
metadata:
  name: clokr-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "clokr-app.labels" . | nindent 4 }}
type: Opaque
stringData:
  # WARNING: Placeholder values only — real values via ArgoCD UI parameters (D-11a, Pitfall #2).
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | default "CHANGEME-min-32-chars-jwt-secret!!" | quote }}
  JWT_REFRESH_SECRET: {{ .Values.secrets.jwtRefreshSecret | default "CHANGEME-min-32-chars-refresh!!" | quote }}
  JWT_EXPIRES_IN: "15m"
  JWT_REFRESH_EXPIRES_IN: "7d"
  ENCRYPTION_KEY: {{ .Values.secrets.encryptionKey | default "CHANGEME-min-32-chars-encryption!!" | quote }}
  APP_URL: {{ .Values.secrets.appUrl | quote }}
  CORS_ORIGIN: {{ .Values.secrets.corsOrigin | quote }}
  SEED_DEMO_DATA: {{ .Values.secrets.seedDemoData | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | default "changeme" | quote }}
  {{- if .Values.secrets.redisUrl }}
  REDIS_URL: {{ .Values.secrets.redisUrl | quote }}
  {{- end }}
