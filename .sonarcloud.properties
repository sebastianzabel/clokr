# SonarCloud Automatic Analysis scope.
#
# Automatic Analysis reads THIS file (not sonar-project.properties) and only honours scope
# parameters — per-rule issue exclusions (sonar.issue.ignore.*) are not supported here, so the
# few remaining false positives in production code are marked "Safe" in the SonarCloud UI.

sonar.sourceEncoding=UTF-8

# ── Test code ───────────────────────────────────────────────────────────────
# Unit/integration tests and the Playwright suite are classified as tests, so Sonar applies its
# test rule set (no vulnerability rules) instead of treating fixtures and demo logins as
# production secrets. Every test pattern is also excluded from sonar.sources below — a file
# indexed as both source and test aborts the analysis.
sonar.tests=.
sonar.test.inclusions=**/__tests__/**,**/*.test.ts,**/*.test.mjs,**/*.spec.ts,apps/e2e/**
# The files under apps/api/scripts/__tests__/fixtures/ are INPUT files for the lint gates' own
# self-tests (boundary-imports, guard-vacuity, tenant-scoping), not tests. E.g. boundary-imports'
# `__tests__/x.test.ts` deliberately contains no test case: it only exists for the scanner to skip
# (owner decision #246), so typescript:S2187 must not fire on it. Also listed in sonar.exclusions.
sonar.test.exclusions=apps/api/scripts/__tests__/fixtures/**

# ── Production sources ──────────────────────────────────────────────────────
sonar.sources=.
# Excluded from source analysis (in addition to the test patterns above):
# - **/scripts/**          developer/operator CLIs (lint gates, test-DB provisioning, one-off
#                          backfills, the anonymizer CronJob). apps/api/scripts ships in the API
#                          image, but only an operator or the CronJob runs it — no network input
#                          reaches it. Its findings (PATH lookup, argv paths, Math.random,
#                          console output) are by design. Trade-off: real bugs in these scripts
#                          are no longer reported either; they stay covered by tsc, ESLint and
#                          their own tests.
# - packages/mcp/**        MCP server for local Claude Code dev tooling; it calls the URL from
#                          CLOKR_API_URL on purpose.
# - seed-credentials.ts    the already-public demo/e2e logins (threat T-275-06).
# - prisma/migrations/**   SQL generated by `prisma migrate diff` (docs/migrations.md) and immutable
#                          once applied: Prisma checksums every applied migration and CI's drift
#                          check compares the chain to schema.prisma, so findings cannot be acted
#                          on. The quoted identifiers (plsql:QuotedIdentifiersCheck on
#                          "AbsenceType") are required because Prisma's PascalCase model/enum names
#                          are case-sensitive in PostgreSQL.
# - scripts/__tests__/fixtures/**  lint-gate fixture inputs (see the test section). Already outside
#                          sources via **/scripts/** and **/__tests__/**, listed explicitly so
#                          narrowing either pattern cannot bring them back.
sonar.exclusions=**/__tests__/**,**/*.test.ts,**/*.test.mjs,**/*.spec.ts,apps/e2e/**,\
  **/scripts/**,\
  packages/mcp/**,\
  packages/db/src/seed-credentials.ts,\
  packages/db/prisma/migrations/**,\
  apps/api/scripts/__tests__/fixtures/**

# Duplication: tests repeat fixture setup by design.
sonar.cpd.exclusions=**/__tests__/**,**/*.test.ts,**/*.spec.ts,apps/e2e/**
