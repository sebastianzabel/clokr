name: Release — Promote & Publish

# Triggered when a GitHub Release is published (which creates a git tag), or manually via
# workflow_dispatch against an existing tag. Publishing via release-please's default
# GITHUB_TOKEN does not start this run — GitHub does not create workflow runs from events
# created by GITHUB_TOKEN — so the `release: published` trigger below can be inert; observed
# on v1.10.0 (2026-08-31): neither promote nor publish-notes ran. Once RELEASE_PLEASE_TOKEN
# exists (see release-please.yml) the release trigger works reliably and workflow_dispatch
# becomes the re-run path instead of the recovery path — see docs/release-process.md.
# Both clokr-api + clokr-web are promoted via a digest-preserving copy from the
# corresponding `:sha-{SHA}` image to the release tags. No rebuild.
#
# Rationale (Memory feedback_image_content_is_source_of_truth):
# The image that ships is bit-identical to the image that was Trivy-scanned in
# build-push.yml. Rebuilding on release would produce a different image (different
# build hash), invalidating the prior security scan. Re-tagging preserves the
# image digest end-to-end.
#
# Tag semantics (Memory feedback_release_tag_on_main):
# The release tag MUST point at the merge commit on main. The commit is resolved from the
# tag itself (env.RELEASE_TAG, see below) rather than from the run's automatic commit-SHA
# context value — on a workflow_dispatch that automatic value is the HEAD of the ref the run
# was started from, NOT the tagged commit, so relying on it would risk promoting an
# unreleased image. Resolving the commit from the tag makes both triggers agree, and
# reproduces today's release-path value exactly (verified: `git rev-list -n1 <tag>` ==
# `gh api repos/{owner}/{repo}/commits/<tag>`).

on:
  release:
    types: [published]
  # Manual re-run against an existing tag. While no RELEASE_PLEASE_TOKEN secret exists,
  # release-please publishes the Release with the default GITHUB_TOKEN, and GitHub does not start
  # workflow runs from events created by that token — the `release: published` trigger above is
  # then inert. Observed on v1.10.0 (2026-08-31): neither promote nor publish-notes ran. Dispatching
  # with the tag is the supported recovery; do NOT un-draft and re-publish the Release by hand to
  # fake a human-token event. This trigger stays useful after the secret exists, as the re-run path.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to promote and publish notes for (e.g. v1.10.0)"
        required: true
        type: string

permissions:
  contents: write # required for release asset upload via sbom-action
  packages: write

# Serialize ALL release promotions globally so a later release (e.g. v1.8.1)
# cannot race an in-flight earlier promote (v1.8.0) on the shared `:latest`
# and `:MAJOR.MINOR` tags. `cancel-in-progress: false` lets a half-promoted
# release finish before the next one starts — avoids partial-tag states
# where one image was retagged but the other wasn't. See WR-03.
concurrency:
  group: release-promote
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # inputs.tag is empty on a release event, so this falls through to the run's automatic
  # ref-name context value (the tag itself, e.g. v1.10.0). On workflow_dispatch, that same
  # automatic value is the BRANCH the run was started from (e.g. "main"), not a tag — that is
  # why every consumer below reads RELEASE_TAG instead of the automatic ref-name value directly.
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  promote:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        image: [clokr-api, clokr-web]

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@06fb636fac595d6fb4b28a5dfcb21a6f5091859c # v4.5.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        env:
          # workflow_dispatch introduces a hand-typed RELEASE_TAG that ends up in crane copy
          # DESTINATIONS under packages: write — reject anything but vX.Y.Z[-suffix] below before
          # any tag is written (T-UMA-01). gh needs GH_TOKEN for the commit-resolution call.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "::error title=Invalid tag format::RELEASE_TAG '${RELEASE_TAG}' does not match the expected vX.Y.Z (optional -suffix) shape."
            exit 1
          fi
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          VERSION=${RELEASE_TAG#v}
          MAJOR_MINOR=$(echo "$VERSION" | cut -d. -f1-2)
          # Resolve the commit from the tag itself rather than the run's automatic commit-SHA
          # context value: on a workflow_dispatch that automatic value is the HEAD of the ref
          # the run was started from, NOT the tagged commit. This is the one resolution path
          # both triggers share (see the header comment above).
          COMMIT_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}" --jq .sha)
          SHA_SHORT=$(echo "$COMMIT_SHA" | cut -c1-7)
          echo "owner=${OWNER_LC}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "major_minor=${MAJOR_MINOR}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA_SHORT}" >> "$GITHUB_OUTPUT"

      - name: Install crane
        uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7

      # Wait for build-push.yml to publish the image for this commit.
      #
      # Until release-please landed, a human cut the GitHub Release only after
      # Build & Push had gone green, so the `:sha-` image was always already
      # there. release-please publishes the Release the instant its PR merges —
      # the same push that STARTS the build — so promote now reliably arrives
      # first and `crane copy` would fail on a source tag that does not exist yet.
      #
      # Polling rather than a workflow dependency: the two runs are triggered by
      # different events (push vs release) and cannot `needs:` each other.
      - name: Wait for the scanned image to exist
        env:
          OWNER: ${{ steps.meta.outputs.owner }}
          IMAGE: ${{ matrix.image }}
          SHA_TAG: ${{ steps.meta.outputs.sha }}
        run: |
          set -euo pipefail
          SRC="${REGISTRY}/${OWNER}/${IMAGE}:sha-${SHA_TAG}"
          # 60 × 30s = 30 min. A cold build of both images takes well under that;
          # exceeding it means Build & Push failed or was never triggered, and
          # promoting is then wrong anyway.
          for attempt in $(seq 1 60); do
            if crane manifest "${SRC}" >/dev/null 2>&1; then
              echo "Found ${SRC} after ${attempt} attempt(s)."
              exit 0
            fi
            echo "Attempt ${attempt}/60: ${SRC} not published yet, waiting 30s ..."
            sleep 30
          done
          echo "::error title=Image never appeared::${SRC} did not exist after 30 minutes."
          echo "Build & Push either failed or never ran for this commit. Check that"
          echo "workflow before re-running this job — do NOT promote a different image."
          exit 1

      - name: Promote ${{ matrix.image }}
        env:
          # WR-03 (Phase 76.14): hoist GitHub Actions expressions into env so the
          # shell sees them as plain variables, not as YAML-template substitutions
          # that splice arbitrary characters straight into the script. Even though
          # all four values are currently safe (repo-owner, matrix literal, 7-char
          # SHA prefix, sanitized version), the env-indirection pattern is the
          # GitHub-recommended hardening for `run:` blocks with `packages: write`.
          OWNER: ${{ steps.meta.outputs.owner }}
          IMAGE: ${{ matrix.image }}
          SHA_TAG: ${{ steps.meta.outputs.sha }}
          VERSION_TAG: ${{ steps.meta.outputs.version }}
          MAJOR_MINOR_TAG: ${{ steps.meta.outputs.major_minor }}
        run: |
          # Fail-fast on any error, undefined variable, or pipe failure (WR-02).
          # Without -u a typo'd $OWNER / $IMAGE / $SHA_TAG would expand to empty
          # and crane would push to an unintended tag (e.g. :latest with garbage).
          set -euo pipefail
          SRC="${REGISTRY}/${OWNER}/${IMAGE}:sha-${SHA_TAG}"
          # Loop so per-tag failure semantics are explicit. `latest` is last so a
          # mid-loop failure leaves an inconsistent-but-recoverable state where
          # the version-pinned tag may already point at the new digest.
          for TAG in "${VERSION_TAG}" "${MAJOR_MINOR_TAG}" "latest"; do
            DST="${REGISTRY}/${OWNER}/${IMAGE}:${TAG}"
            echo "Promoting ${SRC} -> ${DST}"
            crane copy "${SRC}" "${DST}"
          done

      - name: Generate SBOM for ${{ matrix.image }}
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/${{ matrix.image }}:${{ steps.meta.outputs.version }}
          format: spdx-json
          artifact-name: ${{ matrix.image }}-${{ steps.meta.outputs.version }}.sbom.spdx.json
          upload-release-assets: true

  # ── Release notes body (Phase 110, AK-04/AK-15) ───────────────────────────────
  # Replaces the former manual step 5 of docs/release-process.md ("write the German release notes
  # by hand on the GitHub Release"). The notes now live in the repo at docs/release-notes/vX.Y.Z.md,
  # are written BEFORE the release-please PR merges, and are baked into the API image by
  # apps/api/Dockerfile. This job makes the GitHub Release body the DOWNSTREAM copy of that same
  # file, so the text shown in-app and the text shown on GitHub cannot drift apart (N-03).
  #
  # Deliberately NO `needs: promote`: a missing notes file must not delay or block the
  # digest-preserving promotion, and a promote failure must not hide a missing notes file. The two
  # concerns fail independently and are read independently.
  publish-notes:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Publish the German release notes from the repo
        env:
          # WR-03: hoist expressions into env rather than splicing them into the script.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          NOTES="docs/release-notes/${TAG}.md"
          if [ ! -f "$NOTES" ]; then
            echo "::error title=Release notes missing::${NOTES} does not exist at ${TAG}."
            echo "docs/release-process.md requires the German release notes to be on main BEFORE the" >&2
            echo "release-please PR is merged, because apps/api/Dockerfile bakes them into the image" >&2
            echo "built from that merge commit. This tag's image therefore also shipped without them." >&2
            echo "Add docs/release-notes/${TAG}.md, then re-run this job." >&2
            exit 1
          fi
          TITLE=$(head -n 1 "$NOTES" | sed 's/^##[[:space:]]*//')
          gh release edit "$TAG" --title "$TITLE" --notes-file "$NOTES"
          echo "Release body for ${TAG} published from ${NOTES}."

  # ── Post-Deploy Smoke (DEVOPS-V8-05) ─────────────────────────────────
  # Runs after promote completes for BOTH images. Skipped until Phase 71
  # provisions the int cluster + sets the INT_BASE_URL repository variable
  # (`gh variable set INT_BASE_URL --body "https://int.clokr.example/"`).
  # The if-guard makes this a no-op for releases cut before int is live.
  #
  # Phase 76.14: the prior /health probe was removed. The int Ingress
  # only routes /api/v1/* to the API; the bare /health route is registered
  # without that prefix and is therefore unreachable from the public URL.
  # The /api/v1/version probe below is the canonical smoke-test — it returns
  # HTTP 200 only when the service is up AND it returns the version string
  # for comparison against ${TAG}. One probe, two assertions.
  smoke-test:
    needs: promote
    runs-on: ubuntu-latest
    if: ${{ vars.INT_BASE_URL != '' }}
    steps:
      - name: Version match assertion
        env:
          # WR-03 (Phase 76.14): hoist the repo variable into env so it never
          # gets spliced into the script at YAML-template time. Repository
          # variables can be edited via the GitHub UI; an env-indirection makes
          # the dataflow auditable and matches the pattern in the promote step.
          INT_BASE_URL: ${{ vars.INT_BASE_URL }}
        run: |
          # Fail-fast on any error, undefined variable, or pipe failure (memory:
          # release.yml comment WR-02 documents the rationale).
          # curl -sfS exits non-zero on HTTP >= 400 — so reaching the jq parse
          # step already implies the service is up.
          set -euo pipefail
          EXPECTED="${RELEASE_TAG#v}"
          ACTUAL=$(curl -sfS --max-time 10 "${INT_BASE_URL}/api/v1/version" | jq -r '.version')
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "Version mismatch: expected $EXPECTED, got $ACTUAL" >&2
            echo "This usually means the promoted image did not roll out — check the int cluster." >&2
            exit 1
          fi
          echo "Version match OK: $ACTUAL"
