name: Release Please

# Keeps a release PR permanently open against main, updating itself on every
# push. Merging it is what cuts a release — the decision is the merge, not a
# sequence of steps someone has to remember.
#
# What it does on merge:
#   1. bumps the version in package.json, apps/api/package.json and
#      apps/web/package.json (one shared version — see release-please-config.json)
#   2. writes CHANGELOG.md from the Conventional Commit history
#   3. creates tag vX.Y.Z and publishes the GitHub Release
#
# Whether publishing the Release starts release.yml depends on the token above:
#
# - Without RELEASE_PLEASE_TOKEN (the default today): the action runs as the default
#   GITHUB_TOKEN, and GitHub does not start new workflow runs from events created by that
#   token — so `release: published` is inert. Observed on v1.10.0 (2026-08-31): release.yml
#   never ran, promote never produced :1.10.0/:1.10/:latest images, and the Release body kept
#   this action's English commit dump instead of docs/release-notes/v1.10.0.md. Both jobs must
#   then be started by hand: `gh workflow run release.yml --ref main -f tag=vX.Y.Z`.
# - With the secret set: the published Release starts release.yml on its own, and the manual
#   dispatch becomes the re-run path rather than the normal one.
#
# See docs/release-process.md for how to create RELEASE_PLEASE_TOKEN and which token type to
# use — that tradeoff is documented once, there, not repeated here.
#
# That chain is why release.yml waits for the image to exist under EITHER token mode:
# release-please publishes the moment the PR merges, while build-push.yml is still building the
# very commit being released. A human cutting the release by hand used to provide that wait
# implicitly.
#
# The generated CHANGELOG.md is the technical, English, commit-derived history.
# It does NOT replace the customer-facing German release notes, which stay
# hand-written per docs/RELEASE_NOTES_TEMPLATE.md — different audience, different
# document. See docs/release-process.md.

on:
  push:
    branches: [main]
  # Manual re-run. The very first run failed on a repository setting rather than
  # on anything in this config, and without a dispatch trigger the only way to
  # retry was to wait for the next push to main. A release that cannot be
  # retried on demand is a release that waits on unrelated work.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Never let two release PRs be computed at once — the second would race the
# first's manifest update and could propose a version that skips or repeats.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@a02a34c4d625f9be7cb89156071d8567266a2445 # v4.2.0
        with:
          # Falls back to the default GITHUB_TOKEN while the secret does not exist, so this
          # workflow keeps behaving exactly as before and upgrades itself the moment the secret is
          # added — see the header comment for what changes then. Token-source-agnostic on purpose:
          # a fine-grained PAT and a GitHub-App installation token are both just "not GITHUB_TOKEN".
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
