name: Anonymizer Manual Trigger

# Phase 72 D-14: workflow_dispatch fallback for on-demand prod-to-int data
# refresh. The scheduled run lives in the k3s CronJob
# (charts/clokr-app/templates/cronjob-anonymizer.yaml). This workflow uses
# `kubectl create job --from=cronjob/...` to spawn an immediate one-off Job
# from the same CronJob spec — same image, same env, same audit trail.
#
# Required secret (set by the operator, see Plan 72-02 Task 5):
#   INT_KUBECONFIG — base64-encoded kubeconfig with RBAC scoped to:
#     namespace=clokr
#     resources: jobs (create/get/list/watch), pods (get/list/watch/log)
#
# After Plan 72-02 lands but before Plan 72-03 + INT_KUBECONFIG are set, this
# workflow will fail at the kubectl step. This is the intended state.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual refresh (audit log)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NAMESPACE: clokr
      CRONJOB_NAME: clokr-app-anonymizer
      JOB_NAME: anonymizer-manual-${{ github.run_id }}
    steps:
      - name: Install kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4

      - name: Configure kubeconfig
        env:
          INT_KUBECONFIG: ${{ secrets.INT_KUBECONFIG }}
        run: |
          if [ -z "${INT_KUBECONFIG}" ]; then
            echo "::error::INT_KUBECONFIG secret is not set. See Plan 72-02 Task 5."
            exit 1
          fi
          mkdir -p ~/.kube
          printf '%s' "${INT_KUBECONFIG}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl config current-context

      - name: Log reason (audit trail)
        run: |
          echo "::notice::Manual anonymizer run triggered by ${{ github.actor }}: ${{ inputs.reason }}"

      - name: Spawn Job from CronJob
        run: |
          kubectl -n "${NAMESPACE}" create job \
            --from="cronjob/${CRONJOB_NAME}" \
            "${JOB_NAME}"

      - name: Wait for Job completion (max 30 min)
        id: wait
        run: |
          set +e
          kubectl -n "${NAMESPACE}" wait \
            --for=condition=complete \
            --timeout=30m \
            "job/${JOB_NAME}"
          COMPLETE_RC=$?
          if [ "${COMPLETE_RC}" -ne 0 ]; then
            # Job did not complete — check if it failed explicitly
            kubectl -n "${NAMESPACE}" wait \
              --for=condition=failed \
              --timeout=10s \
              "job/${JOB_NAME}" || true
          fi
          echo "complete_rc=${COMPLETE_RC}" >> "$GITHUB_OUTPUT"
          exit "${COMPLETE_RC}"

      - name: Tail logs
        if: always()
        run: |
          kubectl -n "${NAMESPACE}" logs --tail=500 "job/${JOB_NAME}" || true

      - name: Show Job status
        if: always()
        run: |
          kubectl -n "${NAMESPACE}" get "job/${JOB_NAME}" -o yaml || true
