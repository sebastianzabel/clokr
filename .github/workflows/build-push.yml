name: Build & Push

# Runs on every merge to main and to any release/** branch.
# Builds Docker images, pushes with SHA + branch tags, then scans with Trivy.
# Only images that pass the security scan are valid release candidates.
#
# release/** is included so back-port hotfixes (e.g. release/1.8.x → v1.8.13)
# get a Trivy-scanned :sha-{SHA} image for release.yml to promote — the release
# pipeline only re-tags an existing :sha image, it never rebuilds. Without this
# trigger a v1.8.x tag would have no image to promote once main has moved on to
# a newer minor.

on:
  push:
    branches: [main, "release/**"]

permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io

jobs:
  build-push:
    runs-on: ubuntu-latest

    strategy:
      # Do NOT cancel a sibling image build when one fails. The images push
      # BEFORE the Trivy gate runs; with fail-fast (default true) a Trivy
      # failure in one image cancels the other mid-push, leaving its :sha image
      # only partially uploaded and unusable for release promotion.
      fail-fast: false
      matrix:
        include:
          - image: clokr-api
            dockerfile: ./apps/api/Dockerfile
            context: .
          - image: clokr-web
            dockerfile: ./apps/web/Dockerfile
            context: .

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@06fb636fac595d6fb4b28a5dfcb21a6f5091859c # v4.5.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          # Branch-name moving tag. Slashes are illegal in Docker tags, so
          # release/1.8.x → release-1.8.x. main stays :main (unchanged behavior);
          # release branches get their own tag instead of clobbering :main.
          REF_TAG=$(echo "${{ github.ref_name }}" | tr '/' '-')
          echo "owner=${OWNER_LC}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          echo "ref_tag=${REF_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/${{ matrix.image }}:sha-${{ steps.meta.outputs.sha }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/${{ matrix.image }}:${{ steps.meta.outputs.ref_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan container image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/${{ matrix.image }}:sha-${{ steps.meta.outputs.sha }}
          format: sarif
          output: trivy-container-${{ matrix.image }}.sarif
          severity: CRITICAL,HIGH
          exit-code: 1
          # Without this, the action's entrypoint.sh unsets TRIVY_SEVERITY when
          # generating SARIF — exit-code: 1 then fires on MEDIUM/LOW findings too,
          # not just the CRITICAL/HIGH gate this step is meant to enforce. Same
          # fix already applied to .github/workflows/ci.yml (commit 6b551c8).
          limit-severities-for-sarif: true
          trivyignores: .trivyignore

      - name: Upload Trivy container scan to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-container-${{ matrix.image }}.sarif
          category: trivy-container-${{ matrix.image }}
