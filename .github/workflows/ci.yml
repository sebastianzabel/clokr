name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read
  pull-requests: write
  issues: write
  security-events: write # required for SARIF uploads from codeql, secret-scan, trivy-fs (DEVOPS-V8-04)
  actions: read # required for codeql-action/init (DEVOPS-V8-04)

jobs:
  # ── Tests, Lint, Type-Check ──────────────────────────────────────────
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: clokr
          POSTGRES_PASSWORD: password
          POSTGRES_DB: clokr
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://clokr:password@localhost:5432/clokr
      JWT_SECRET: test-jwt-secret-min-32-characters-long
      JWT_REFRESH_SECRET: test-refresh-secret-min-32-characters
      ENCRYPTION_KEY: test-encryption-key-min-32-characters-long!!
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @clokr/db exec prisma generate

      - name: Push schema to test DB
        run: pnpm --filter @clokr/db exec prisma db push

      - name: Lint API
        id: lint
        run: pnpm --filter @clokr/api exec eslint src/ --no-warn-ignored

      - name: Lint Web
        run: pnpm --filter @clokr/web exec eslint src/

      - name: Format check (Prettier)
        run: npx prettier --check "apps/api/src/**/*.ts" "apps/web/src/**/*.{ts,svelte,css}" "packages/**/*.ts" "packages/**/*.json"

      - name: Lint UI primitives usage
        run: pnpm --filter @clokr/web lint:ui

      - name: Primitive class alignment
        run: pnpm --filter @clokr/web lint:ui-classes

      - name: Type check API
        id: typecheck
        run: pnpm --filter @clokr/api typecheck

      - name: Type check Web
        run: pnpm --filter @clokr/web typecheck

      - name: Run API tests with coverage
        id: tests
        run: pnpm --filter @clokr/api test:coverage

      - name: Run Web tests with coverage
        id: tests_web
        run: pnpm --filter @clokr/web test:coverage

      - name: Audit dependencies (pnpm audit)
        # Exits 1 when HIGH or CRITICAL vulnerabilities are found in production dependencies.
        # For accepted CVEs (with documented justification), add to root package.json
        # under pnpm.auditConfig.ignoreCves[]. .trivyignore is Trivy-specific and is
        # NOT read by pnpm audit (RESEARCH § Pitfall 8). Do NOT add --json (pnpm/pnpm#3827).
        run: pnpm audit --audit-level high

      - name: Trivy filesystem scan (pnpm-lock.yaml dependencies)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs-results.sarif
          severity: CRITICAL,HIGH
          exit-code: 1
          trivyignores: .trivyignore

      - name: Upload Trivy FS scan to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-fs-results.sarif
          category: trivy-fs

      - name: Build API
        run: pnpm --filter @clokr/api build

      - name: Build Web
        id: build_web
        run: pnpm --filter @clokr/web build

      - name: Post PR Summary
        if: always()
        uses: actions/github-script@v9
        with:
          script: |
            const lintStatus = '${{ steps.lint.conclusion }}';
            const typecheckStatus = '${{ steps.typecheck.conclusion }}';
            const testsStatus = '${{ steps.tests.conclusion }}';
            const testsWebStatus = '${{ steps.tests_web.conclusion }}';
            const buildWebStatus = '${{ steps.build_web.conclusion }}';

            const icon = (s) => s === 'success' ? '✅' : (s === 'skipped' ? '⏭️' : '❌');

            const body = `## CI Summary

            | Check | Status |
            |-------|--------|
            | ${icon(lintStatus)} Lint (API + Web) | ${lintStatus} |
            | ${icon(typecheckStatus)} TypeScript (API) | ${typecheckStatus} |
            | ${icon(testsStatus)} API Tests + Coverage (lines >= 40) | ${testsStatus} |
            | ${icon(testsWebStatus)} Web Tests + Coverage (lines >= 40) | ${testsWebStatus} |
            | ${icon(buildWebStatus)} Web Build | ${buildWebStatus} |

            _Detailed errors are in the job logs above._
            `;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body?.includes('## CI Summary'));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # ── CodeQL SAST (DEVOPS-V8-04) ───────────────────────────────────────
  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          config-file: .github/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"

  # ── Secret scan (DEVOPS-V8-04) ───────────────────────────────────────
  # NOTE: gitleaks/gitleaks-action requires a free GITLEAKS_LICENSE for org repos.
  # If license cannot be provisioned, fallback action is `gacts/gitleaks` (MIT, no license).
  # See 70-03-SUMMARY.md for setup instructions.
  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # required for gitleaks to access commit history

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # ── Lighthouse CI (DEVOPS-V8-05, advisory in Phase 70) ───────────────
  # Phase 73 will upgrade to blocking + extend to authenticated pages via
  # docker-compose webServer integration. Today: login page only, warn-mode.
  lighthouse:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Web (for static Lighthouse audit)
        run: pnpm --filter @clokr/web build
        env:
          PUBLIC_API_URL: http://localhost:4000

      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12.6.2
        with:
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: .github/lighthouserc.json

  # ── Axe a11y scan (DEVOPS-V8-05, advisory in Phase 70) ───────────────
  # Phase 73 will upgrade to blocking + extend to authenticated pages.
  axe-scan:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter e2e exec playwright install --with-deps chromium

      - name: Build Web (for axe to scan)
        run: pnpm --filter @clokr/web build
        env:
          PUBLIC_API_URL: http://localhost:4000

      - name: Serve built Web on :4173
        run: pnpm --filter @clokr/web preview --port 4173 &
        # & sends to background; subsequent step polls for readiness.

      - name: Wait for preview server
        run: |
          set -euo pipefail
          for i in {1..30}; do
            if curl -sf http://localhost:4173/login > /dev/null; then
              echo "Preview server ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Preview server did not start in 30s" >&2
          exit 1

      - name: Run axe scan on /login
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:4173
        run: pnpm --filter e2e exec playwright test --project=axe-scan tests/axe-scan.spec.ts

  # ── Docker Build Check (no push) ──────────────────────────────────────
  # Validates Dockerfiles compile and warms the GHA cache for faster builds on main.
  docker:
    needs: test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - image: clokr-api
            dockerfile: ./apps/api/Dockerfile
            context: .
          - image: clokr-web
            dockerfile: ./apps/web/Dockerfile
            context: .

    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build (no push)
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
