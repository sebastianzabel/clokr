name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read
  pull-requests: write
  issues: write
  security-events: write # required for SARIF uploads from codeql, secret-scan, trivy-fs (DEVOPS-V8-04)
  actions: read # required for codeql-action/init (DEVOPS-V8-04)

jobs:
  # ── Tests, Lint, Type-Check ──────────────────────────────────────────
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: clokr
          POSTGRES_PASSWORD: password
          POSTGRES_DB: clokr
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://clokr:password@localhost:5432/clokr
      # apps/api tests connect to a separate `test` schema for isolation
      # (mirrors apps/api/.env.test which is gitignored).
      TEST_DATABASE_URL: postgresql://clokr:password@localhost:5432/clokr?schema=test
      JWT_SECRET: test-jwt-secret-min-32-characters-long
      JWT_REFRESH_SECRET: test-refresh-secret-min-32-characters
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      ENCRYPTION_KEY: test-encryption-key-min-32-characters-long!!
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @clokr/db exec prisma generate

      - name: Push schema to test DB
        run: pnpm --filter @clokr/db exec prisma db push

      - name: Sync SvelteKit generated files
        # ESLint + tsc on apps/web extend ./.svelte-kit/tsconfig.json (generated
        # by `svelte-kit sync`). The file is gitignored, so we must regenerate
        # it before any lint/typecheck step that touches Web. Required for
        # Lint Web, Type check Web, Run Web tests with coverage.
        run: pnpm --filter @clokr/web exec svelte-kit sync

      - name: Lint API
        id: lint
        run: pnpm --filter @clokr/api exec eslint src/ --no-warn-ignored

      - name: Lint Web
        run: pnpm --filter @clokr/web exec eslint src/

      - name: Format check (Prettier)
        run: npx prettier --check "apps/api/src/**/*.ts" "apps/web/src/**/*.{ts,svelte,css}" "packages/**/*.ts" "packages/**/*.json"

      - name: Lint UI primitives usage
        run: pnpm --filter @clokr/web lint:ui

      - name: Primitive class alignment
        run: pnpm --filter @clokr/web lint:ui-classes

      - name: Lint legacy token references
        # CLAUDE.md § UI Consistency Rules mandates this alongside lint:ui-classes —
        # blocks reintroduction of banned v1.2 tokens (--color-*, --glass-*, etc.).
        run: pnpm --filter @clokr/web lint:tokens

      - name: Type check API
        id: typecheck
        run: pnpm --filter @clokr/api typecheck

      - name: Type check Web
        run: pnpm --filter @clokr/web typecheck

      - name: Run API tests with coverage
        id: tests
        run: pnpm --filter @clokr/api test:coverage

      - name: Run Web tests with coverage
        id: tests_web
        run: pnpm --filter @clokr/web test:coverage

      - name: Web coverage gate (lib/ lines floor)
        # Phase 76-03 (D-05): hard CI gate on apps/web/src/lib/** line coverage.
        # The floor is encoded in apps/web/scripts/check-coverage.mjs (v1.8: 5%,
        # v1.9 target: 40%). Separate from vitest's built-in threshold so CI
        # produces a cleaner error message and the floor is decoupled from
        # vitest.config.ts drift.
        id: coverage_gate_web
        run: node apps/web/scripts/check-coverage.mjs

      - name: Audit dependencies (pnpm audit)
        # Exits 1 when HIGH or CRITICAL vulnerabilities are found in production dependencies.
        # For accepted CVEs (with documented justification), add to root package.json
        # under pnpm.auditConfig.ignoreCves[]. .trivyignore is Trivy-specific and is
        # NOT read by pnpm audit (RESEARCH § Pitfall 8). Do NOT add --json (pnpm/pnpm#3827).
        run: pnpm audit --audit-level high

      # ── Trivy filesystem scan ─────────────────────────────────────
      # Two steps: (1) human-readable table in CI log so findings are visible
      # without downloading SARIF; (2) SARIF generation for GitHub Security tab.
      # Both share the SAME trivy version + skip-dirs + ignorefile.
      # skip-dirs:
      #   - .claude/skills/*/prototypes/** — Claude Skill prototypes are NOT
      #     deployed; their package-lock.json files can carry HIGH CVEs (e.g.
      #     undici WebSocket DoS) that have no production impact
      #   - .claude/worktrees/** — isolated agent worktrees with stale lockfiles
      #   - .svelte-kit/** — generated build artifacts
      - name: Trivy filesystem scan — table output (CI log diagnostics)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0 (action) — runs Trivy v0.71.0 via `version:` input
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          exit-code: 0 # diagnostic step — do not fail here
          trivyignores: .trivyignore
          skip-dirs: ".claude/skills/*/prototypes,.claude/worktrees,.svelte-kit"
          version: v0.71.0

      - name: Trivy filesystem scan — SARIF upload (blocking)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0 (action) — runs Trivy v0.71.0 via `version:` input
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs-results.sarif
          severity: CRITICAL,HIGH
          exit-code: 1
          # Without this, the action's entrypoint.sh unsets TRIVY_SEVERITY when
          # generating SARIF (so the SARIF report contains all severities), but
          # the unset is process-global — `exit-code: 1` then also fires on
          # MEDIUM/LOW findings. Setting this to true keeps the severity filter
          # applied to both SARIF generation AND the exit-code check, matching
          # the table-output step above.
          limit-severities-for-sarif: true
          trivyignores: .trivyignore
          skip-dirs: ".claude/skills/*/prototypes,.claude/worktrees,.svelte-kit"
          version: v0.71.0

      - name: Upload Trivy FS scan to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-fs-results.sarif
          category: trivy-fs

      - name: Build API
        run: pnpm --filter @clokr/api build

      - name: Build Web
        id: build_web
        run: pnpm --filter @clokr/web build

      - name: Post PR Summary
        if: always()
        uses: actions/github-script@v9
        with:
          script: |
            const lintStatus = '${{ steps.lint.conclusion }}';
            const typecheckStatus = '${{ steps.typecheck.conclusion }}';
            const testsStatus = '${{ steps.tests.conclusion }}';
            const testsWebStatus = '${{ steps.tests_web.conclusion }}';
            const coverageGateWebStatus = '${{ steps.coverage_gate_web.conclusion }}';
            const buildWebStatus = '${{ steps.build_web.conclusion }}';

            // Visual regression status (separate job, Phase 75) — fetch via API.
            // The visual-regression job runs in parallel with this `test` job, so its
            // conclusion is NOT available as a step output here; we read it from the
            // workflow run's jobs list. May still be `in_progress` when this summary
            // step fires — the comment is best-effort and updates on subsequent re-runs.
            let visualStatus = 'unknown';
            try {
              const runs = await github.rest.actions.listJobsForWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
              });
              const visualJob = runs.data.jobs.find(j => j.name === 'visual-regression');
              if (visualJob && visualJob.status === 'completed') {
                visualStatus = visualJob.conclusion || 'unknown';
              } else if (visualJob) {
                visualStatus = 'in_progress';
              } else {
                // Job entry not yet created (race) — treat as in_progress for icon purposes.
                visualStatus = 'in_progress';
              }
            } catch (e) {
              visualStatus = 'unknown';
            }

            const icon = (s) => s === 'success' ? '✅' : (s === 'skipped' ? '⏭️' : '❌');

            const body = `## CI Summary

            | Check | Status |
            |-------|--------|
            | ${icon(lintStatus)} Lint (API + Web) | ${lintStatus} |
            | ${icon(typecheckStatus)} TypeScript (API) | ${typecheckStatus} |
            | ${icon(testsStatus)} API Tests + Coverage (lines >= 40) | ${testsStatus} |
            | ${icon(testsWebStatus)} Web Tests + Coverage | ${testsWebStatus} |
            | ${icon(coverageGateWebStatus)} Web Coverage Gate (lib/ lines floor) | ${coverageGateWebStatus} |
            | ${icon(buildWebStatus)} Web Build | ${buildWebStatus} |
            | ${icon(visualStatus)} Visual regression (Phase 75) | ${visualStatus} |

            _Detailed errors are in the job logs above._
            `;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body?.includes('## CI Summary'));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # ── CodeQL SAST (DEVOPS-V8-04) ───────────────────────────────────────
  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          config-file: .github/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"

  # ── Secret scan (DEVOPS-V8-04) ───────────────────────────────────────
  # NOTE: gitleaks/gitleaks-action requires a free GITLEAKS_LICENSE for org repos.
  # If license cannot be provisioned, fallback action is `gacts/gitleaks` (MIT, no license).
  # See 70-03-SUMMARY.md for setup instructions.
  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # required for gitleaks to access commit history

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # ── Lighthouse CI (DEVOPS-V8-05, advisory in Phase 70) ───────────────
  # Phase 73 will upgrade to blocking + extend to authenticated pages via
  # docker-compose webServer integration. Today: login page only, warn-mode.
  #
  # DISABLED 2026-06-05: treosh/lighthouse-ci-action@v12.6.2 produces NO_FCP
  # on this runner even with --no-sandbox --disable-dev-shm-usage --disable-gpu
  # --headless=new and 60s/90s timeouts. Local `pnpm preview` returns the
  # login page (HTTP 200, 6KB HTML, all form elements present) — the page
  # paints. This is a headless-Chrome / lighthouse-ci-action environment
  # bug, not an app bug. Phase 73's docker-compose webServer migration
  # rewrites the audit harness end-to-end (different lifecycle, different
  # Chrome launcher) so re-enabling here under the broken setup would only
  # produce noise. Re-enable as part of Phase 73 with the new harness.
  lighthouse:
    if: false
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Web (for static Lighthouse audit)
        run: pnpm --filter @clokr/web build
        env:
          PUBLIC_API_URL: http://localhost:4000

      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12.6.2
        with:
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: .github/lighthouserc.json

  # ── Axe a11y scan (DEVOPS-V8-05, advisory in Phase 70) ───────────────
  # Phase 73 will upgrade to blocking + extend to authenticated pages.
  axe-scan:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter e2e exec playwright install --with-deps chromium

      - name: Build Web (for axe to scan)
        run: pnpm --filter @clokr/web build
        env:
          PUBLIC_API_URL: http://localhost:4000

      - name: Serve built Web on :4173
        run: pnpm --filter @clokr/web preview --port 4173 &
        # & sends to background; subsequent step polls for readiness.

      - name: Wait for preview server
        run: |
          set -euo pipefail
          for i in {1..30}; do
            if curl -sf http://localhost:4173/login > /dev/null; then
              echo "Preview server ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Preview server did not start in 30s" >&2
          exit 1

      - name: Run axe scan on /login
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:4173
          # Phase 73-07's playwright.config has a docker-compose webServer for the
          # main test suite. axe-scan brings its own preview server (port 4173) on
          # this runner, so skip the docker-compose bring-up to avoid postgres-test
          # container conflicts with the runner's lack of docker network access.
          WEB_SERVER_DISABLED: "true"
        run: pnpm --filter e2e exec playwright test --project=axe-scan tests/axe-scan.spec.ts

  # ── Visual regression (TEST-V8-14, Phase 75) ─────────────────────────
  # Runs the pinned Playwright image (mcr.microsoft.com/playwright:v1.60.0-jammy
  # — see apps/e2e/Dockerfile.visual; tag MUST match @playwright/test version in
  # apps/e2e/package.json) against the committed baselines under
  # apps/e2e/tests/visual.spec.ts-snapshots/.
  # Gated on visual-relevant path changes only (D-06) — docs-only / API-only
  # / .planning-only PRs skip this job entirely.
  visual-regression:
    runs-on: ubuntu-latest
    # Path filter: only run when the PR touches code that can affect rendered output.
    # GitHub does not support `on.pull_request.paths` PLUS per-job conditionals
    # cleanly; we use the dorny/paths-filter pattern instead. The pre-step decides
    # whether the heavy steps run.
    steps:
      - uses: actions/checkout@v6

      - name: Detect visual-relevant changes
        id: changes
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          filters: |
            visual:
              - 'apps/web/**'
              - 'apps/web/src/tokens.css'
              - 'apps/e2e/**'
              - 'apps/e2e/tests/visual.spec.ts-snapshots/**'
              - 'docker-compose.e2e.yml'
              - '.github/workflows/ci.yml'

      - name: Skip notice (no visual-relevant changes)
        if: steps.changes.outputs.visual != 'true'
        run: |
          echo "::notice title=Visual regression skipped::No changes under apps/web/**, tokens.css, or apps/e2e/** — skipping visual-regression job (D-06)."

      - uses: actions/setup-node@v6
        if: steps.changes.outputs.visual == 'true'
        with:
          node-version: 24

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        if: steps.changes.outputs.visual == 'true'

      - name: Install dependencies
        if: steps.changes.outputs.visual == 'true'
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        if: steps.changes.outputs.visual == 'true'
        run: pnpm --filter @clokr/db exec prisma generate

      - name: Build web (for the visual stack)
        if: steps.changes.outputs.visual == 'true'
        run: pnpm --filter @clokr/web build
        env:
          PUBLIC_API_URL: http://localhost:4000

      - name: Start docker test stack
        if: steps.changes.outputs.visual == 'true'
        run: |
          # Use the 73-07 test stack (ports 5433/4001/3001) which has known-good
          # CI defaults via apps/api/.env.test — the prod-shaped dev stack on
          # 5432/4000/3000 needs runtime secrets that aren't available on the runner.
          docker compose -f docker-compose.test.yml up --wait --quiet-pull
          # Sanity probe — --wait already blocks on healthcheck, but log it so the
          # CI annotation makes the boundary obvious.
          curl -sf http://localhost:4001/api/v1/health || (echo "api-test not healthy" && exit 1)
          curl -sf http://localhost:3001/login || (echo "web-test not reachable" && exit 1)

      - name: Run visual project inside pinned image (D-02, D-03, D-04)
        id: visual
        if: steps.changes.outputs.visual == 'true'
        run: |
          docker compose -f docker-compose.e2e.yml build e2e-visual
          # The visual runner mounts anonymous volumes over node_modules to keep
          # linux/macOS binaries separated (docker-compose.e2e.yml comment), so
          # node_modules is empty on container start and `pnpm exec playwright`
          # can't find the binary. Chain `pnpm install` first — the Dockerfile
          # comment already documents this as the intended container entry shape.
          # --user root: the bind-mounted /work is owned by the GH Actions runner
          # user (uid 1001), not pwuser (uid 1000) from the playwright base image.
          # When pwuser tries `pnpm install`, it writes atomic tmp files next to
          # the targets in /work and hits EACCES. Running as root sidesteps it;
          # Chromium runs fine as root inside the playwright container (no sandbox
          # implications for CI throwaway runs). Local devs on macOS don't hit
          # this because Docker Desktop handles uid mapping.
          # WEB_SERVER_DISABLED: the playwright.config.ts webServer is meant to
          # bring up docker-compose.test.yml on first invocation, but the CI step
          # above already did that. Without this flag, Playwright sees port 4001
          # busy and aborts with "is already used, … set reuseExistingServer:true"
          # because reuseExistingServer is gated on `!CI` (false here). Same
          # escape hatch axe-scan uses.
          docker compose -f docker-compose.e2e.yml run --rm \
            --user root \
            -e PLAYWRIGHT_BASE_URL=http://localhost:3001 \
            -e CI=true \
            -e WEB_SERVER_DISABLED=true \
            e2e-visual \
            sh -c "pnpm install --frozen-lockfile && pnpm --filter e2e exec playwright test --project=visual"

      - name: Upload playwright-report on failure
        if: failure() && steps.changes.outputs.visual == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-report
          path: apps/e2e/playwright-report/
          retention-days: 14

      - name: Upload diff PNGs on failure
        if: failure() && steps.changes.outputs.visual == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-diffs
          path: apps/e2e/test-results/**/*.png
          retention-days: 14

      - name: Tear down docker stack
        if: always() && steps.changes.outputs.visual == 'true'
        run: docker compose -f docker-compose.test.yml down -v || true

  # ── Docker Build Check (no push) ──────────────────────────────────────
  # Validates Dockerfiles compile and warms the GHA cache for faster builds on main.
  docker:
    needs: test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - image: clokr-api
            dockerfile: ./apps/api/Dockerfile
            context: .
          - image: clokr-web
            dockerfile: ./apps/web/Dockerfile
            context: .

    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build (no push)
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
